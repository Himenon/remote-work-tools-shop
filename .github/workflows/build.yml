name: Build and Test

on:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    # @see https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#concurrency
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: true

    strategy:
      matrix:
        node-version: [24.x]
        os: [macos-latest]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/initialize
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: "package.json"
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('packages/ui/package.json') }}
      - run: pnpm --filter @rwts/ui exec playwright install --with-deps chromium
        timeout-minutes: 5
      - name: Test & Build
        run: |
          pnpm build  
          pnpm check
          pnpm test
        env:
          CI: true
          DATABASE_URL: file:./prisma/dev.db
