packages:
  - apps/*
  - packages/*

allowBuilds:
  "@parcel/watcher": true
  "@prisma/engines": true
  better-sqlite3: true
  esbuild: true
  lefthook: true
  prisma: true

catalog:
  "@types/node": 25.6.0
  "@types/react": "19"
  "@types/react-dom": "19"
  react: 19.2.5
  react-dom: 19.2.5
  react-hook-form: ^7.72.1
  vitest: 4.1.4
  zod: ^4.3.6

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

minimumReleaseAge: 10800

minimumReleaseAgeExclude:
  - oxfmt
  - oxlint
  - hono
  - honox
  - "@hono/*"
  - "@oxlint/*"
  - "@oxfmt/*"
  - "@typescript/*"
  - "typescript"

onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@prisma/engines"
  - "@swc/core"
  - better-sqlite3
  - esbuild
  - lefthook
  - prisma
